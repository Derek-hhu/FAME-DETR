# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-l object detection model with P3-P5 outputs. For details see https://docs.ultralytics.com/models/rtdetr

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# From BiliBili 魔鬼面具
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4
  
  - [-1, 1, FCM_1, []]
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 1, FCM_2, []]
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 1, FCM_3, []]
  - [-1, 1, MKP, []] # 9-P4/16
  - [-1, 1, FCM_4, []]
  - [-1, 1, SPPF, [512, 5]] # 11

head:
  - [-1, 1, Conv, [256, 3, 2]]  # 12 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 13
  - [-1, 1, Conv, [256, 1, 1]]  # 14, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 16 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 17
  - [-1, 3, RepC3, [256, 0.5]]  # 18, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 19, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 20
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 21 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 22 cat backbone P2
  - [-1, 3, RepC3, [256, 0.5]]    # Y3 (23), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]   # 24 Y4, downsample_convs.0
  - [[-1, 19], 1, Concat, [1]]  # 25 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # Y4 (26), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]   # 27 Y5, downsample_convs.1
  - [[-1, 14], 1, Concat, [1]]  # 28 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # F5 (29), pan_blocks.1

  - [[23, 26, 29], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)
